<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>光影捕手 - 低視能訓練遊戲</title>
  <style>
    :root {
      --bg-color: #000000;
      --fg-color: #FFFF00;
      --accent-color: #00FF00;
      --distractor-color: rgba(255, 255, 255, 0.35);
      --panel-bg: #161618;
      --panel-text: #FFFFFF;
      --border-color: #444444;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      color: var(--fg-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang HK", "Microsoft JhengHei", sans-serif;
    }

    /* 主遊戲畫布（支援純色、雙色、多色背景） */
    #game-area {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000000;
      transition: background 0.3s ease;
    }

    /* 頂部低干擾進度條 */
    #progress-bar-container {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 20;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.45);
      padding: 6px 14px;
      border-radius: 20px;
    }

    .progress-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 3px solid #FFFF00;
      background-color: transparent;
      transition: background-color 0.25s ease, transform 0.25s ease;
    }

    .progress-dot.filled {
      background-color: #FFFF00;
      transform: scale(1.15);
    }

    /* 目標物件與擴大觸控區 */
    .target-wrapper {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      transform: translate(-50%, -50%);
      padding: 20px;
    }

    .target-graphic {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: breathe 2.2s infinite ease-in-out;
    }

    .target-graphic.flash-mode {
      animation: peripheralPulse 1.1s infinite ease-in-out;
    }

    .target-number {
      position: absolute;
      font-weight: 900;
      pointer-events: none;
    }

    /* 序列掃視引導光環 */
    .guide-ring {
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      border: 7px dashed var(--accent-color);
      animation: spinSlow 6s linear infinite;
      pointer-events: none;
    }

    /* 干擾物件 */
    .distractor-item {
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 5;
      opacity: 0.65;
    }

    /* 煙花粒子 */
    .particle {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: 30;
    }

    /* 溫和誤觸波紋 */
    .miss-ripple {
      position: absolute;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 5px solid #FFFF00;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.7);
      opacity: 0.6;
      transform: translate(-50%, -50%) scale(0.5);
      animation: rippleFade 0.5s ease-out forwards;
      pointer-events: none;
      z-index: 15;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(0.96); }
      50% { transform: scale(1.04); }
    }

    @keyframes peripheralPulse {
      0%, 100% { opacity: 0.25; transform: scale(0.92); }
      50% { opacity: 1; transform: scale(1.06); }
    }

    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes rippleFade {
      to {
        transform: translate(-50%, -50%) scale(1.8);
        opacity: 0;
      }
    }

    /* 隱藏式教師按鈕（左上角長按 2 秒） */
    #teacher-trigger {
      position: fixed;
      top: 14px;
      left: 14px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(30, 30, 30, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      cursor: pointer;
    }

    #teacher-trigger svg.gear-icon {
      width: 28px;
      height: 28px;
      fill: rgba(220, 220, 220, 0.75);
    }

    #hold-ring {
      position: absolute;
      top: 0;
      left: 0;
      width: 56px;
      height: 56px;
      transform: rotate(-90deg);
    }

    #hold-ring circle {
      fill: none;
      stroke: #FFFF00;
      stroke-width: 5;
      stroke-dasharray: 157;
      stroke-dashoffset: 157;
    }

    /* 啟動與休息遮罩畫面 */
    #start-overlay, #break-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.94);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 24px;
      text-align: center;
    }

    .big-start-btn {
      background-color: #FFFF00;
      color: #000000;
      border: none;
      border-radius: 28px;
      padding: 30px 60px;
      font-size: 2.3rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 0 35px rgba(255, 255, 0, 0.6);
      margin-top: 24px;
    }

    .big-start-btn:active {
      transform: scale(0.96);
    }

    #break-overlay {
      display: none;
    }

    .trophy-icon {
      font-size: 6.5rem;
      margin-bottom: 10px;
      animation: breathe 1.8s infinite ease-in-out;
    }

    .break-title {
      font-size: 2.5rem;
      font-weight: 900;
      color: #FFFF00;
      margin: 8px 0;
    }

    .break-stats {
      background: #1C1C1E;
      border: 2px solid #444;
      border-radius: 16px;
      padding: 18px 32px;
      margin: 18px 0;
      color: #FFFFFF;
      font-size: 1.25rem;
      line-height: 1.8;
    }

    /* 教師設定面板 */
    #teacher-panel {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 16px;
    }

    .panel-card {
      background-color: var(--panel-bg);
      color: var(--panel-text);
      width: 100%;
      max-width: 820px;
      max-height: 92vh;
      overflow-y: auto;
      border-radius: 20px;
      border: 2px solid var(--border-color);
      padding: 24px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 14px;
      margin-bottom: 18px;
    }

    .panel-header h2 {
      margin: 0;
      font-size: 1.45rem;
      color: #FFFF00;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-box {
      background: #252529;
      padding: 12px;
      border-radius: 12px;
      text-align: center;
    }

    .stat-value {
      font-size: 1.6rem;
      font-weight: 800;
      color: #00FF00;
    }

    .stat-label {
      font-size: 0.85rem;
      color: #CCCCCC;
      margin-top: 4px;
    }

    .setting-group {
      margin-bottom: 18px;
    }

    .setting-group label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
      font-size: 1.05rem;
      color: #EFEFEF;
    }

    .sub-label {
      font-size: 0.85rem;
      color: #AAAAAA;
      margin: 6px 0 6px 0;
      font-weight: 600;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .opt-btn {
      background: #2C2C30;
      color: #FFFFFF;
      border: 2px solid #48484D;
      border-radius: 10px;
      padding: 8px 13px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .opt-btn.active {
      background: #FFFF00;
      color: #000000;
      border-color: #FFFF00;
    }

    .color-swatch {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid #888;
      display: inline-block;
      flex-shrink: 0;
    }

    #contrast-warning {
      display: none;
      background: #5C1A1A;
      color: #FFD6D6;
      border: 1px solid #FF6B6B;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      margin-top: 8px;
    }

    .panel-footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid var(--border-color);
    }

    .action-btn {
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
    }

    .btn-reset {
      background: #3A3A3C;
      color: #FF6B6B;
    }

    .btn-close {
      background: #00FF00;
      color: #000000;
      flex: 1;
    }
  </style>
</head>
<body>

  <!-- 主遊戲畫面 -->
  <div id="game-area">
    <div id="progress-bar-container"></div>
  </div>

  <!-- 隱藏式教師按鈕（左上角長按 2 秒） -->
  <div id="teacher-trigger" title="長按 2 秒開啟教師設定">
    <svg id="hold-ring" viewBox="0 0 56 56">
      <circle id="hold-circle" cx="28" cy="28" r="25"></circle>
    </svg>
    <svg class="gear-icon" viewBox="0 0 24 24">
      <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
    </svg>
  </div>

  <!-- 開始畫面 -->
  <div id="start-overlay">
    <div style="font-size: 5rem;">☀️</div>
    <h1 style="font-size: 2.6rem; color: #FFFF00; margin: 12px 0;">光影捕手</h1>
    <p style="font-size: 1.2rem; color: #CCCCCC; max-width: 480px;">
      低視能視覺注視、追視與搜尋訓練<br/>
      <span style="font-size: 0.95rem; color: #888;">（進入後長按左上角齒輪 2 秒可開啟教師設定）</span>
    </p>
    <button class="big-start-btn" id="start-btn">開始訓練</button>
  </div>

  <!-- 回合休息獎勵畫面 -->
  <div id="break-overlay">
    <div class="trophy-icon">🏆</div>
    <div class="break-title">好叻喎！做得好！</div>
    <div class="break-stats" id="break-stats-text">
      本回合完成：10 個目標<br/>
      平均反應時間：1.5 秒
    </div>
    <button class="big-start-btn" id="continue-btn">繼續下一回合</button>
    <div id="teacher-unlock-hint" style="display:none; color:#AAA; margin-top:14px; font-size:1rem;">
      已開啟防誤觸保護：請老師長按按鈕 1.5 秒繼續
    </div>
  </div>

  <!-- 教師設定面板 -->
  <div id="teacher-panel">
    <div class="panel-card">
      <div class="panel-header">
        <h2>👩‍🏫 教師訓練參數與記錄</h2>
        <span style="font-size: 0.9rem; color: #AAA;">設定即時生效</span>
      </div>

      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-value" id="stat-total">0</div>
          <div class="stat-label">本節累計完成</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" id="stat-avg-rt">--</div>
          <div class="stat-label">平均反應時間 (秒)</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" id="stat-round">0 / 10</div>
          <div class="stat-label">本回合進度</div>
        </div>
      </div>

      <!-- 1. 訓練難度模式 -->
      <div class="setting-group">
        <label>1. 訓練難度模式</label>
        <div class="btn-group" data-setting="difficulty">
          <button class="opt-btn active" data-val="1">難度1：基礎注視定位</button>
          <button class="opt-btn" data-val="2">難度2：動態視覺追視</button>
          <button class="opt-btn" data-val="3">難度3：干擾排除搜尋</button>
          <button class="opt-btn" data-val="4">難度4：序列雙重掃視</button>
          <button class="opt-btn" data-val="5">難度5：周邊視野閃現</button>
        </div>
      </div>

      <!-- 2. 目標尺寸（依螢幕比例計算，最大佔畫面 1/3） -->
      <div class="setting-group">
        <label>2. 目標圖案大小（依螢幕短邊比例自動縮放）</label>
        <div class="btn-group" data-setting="sizeRatio">
          <button class="opt-btn active" data-val="0.33">超大（佔畫面 1/3）</button>
          <button class="opt-btn" data-val="0.25">大（佔畫面 1/4）</button>
          <button class="opt-btn" data-val="0.17">中（佔畫面 1/6）</button>
          <button class="opt-btn" data-val="0.11">小（佔畫面 1/9）</button>
        </div>
      </div>

      <!-- 3. 背景顏色選擇（支援純色、雙色、多色） -->
      <div class="setting-group">
        <label>3. 背景顏色（支援純色、雙色、多色）</label>
        
        <div class="sub-label">純色背景：</div>
        <div class="btn-group" data-setting="bgMode">
          <button class="opt-btn active" data-val="solid-black"><span class="color-swatch" style="background:#000000"></span>純黑</button>
          <button class="opt-btn" data-val="solid-white"><span class="color-swatch" style="background:#FFFFFF"></span>純白</button>
          <button class="opt-btn" data-val="solid-navy"><span class="color-swatch" style="background:#001845"></span>深藍</button>
          <button class="opt-btn" data-val="solid-gray"><span class="color-swatch" style="background:#26262A"></span>深灰</button>
          <button class="opt-btn" data-val="solid-cream"><span class="color-swatch" style="background:#FFF8DC"></span>柔光米黃</button>
        </div>

        <div class="sub-label">雙色視覺刺激背景：</div>
        <div class="btn-group" data-setting="bgMode">
          <button class="opt-btn" data-val="dual-checker"><span class="color-swatch" style="background:linear-gradient(135deg,#000 50%,#FFF 50%)"></span>黑白棋盤格</button>
          <button class="opt-btn" data-val="dual-stripes"><span class="color-swatch" style="background:linear-gradient(90deg,#000 50%,#FFD600 50%)"></span>黑黃雙色寬條</button>
          <button class="opt-btn" data-val="dual-split"><span class="color-swatch" style="background:linear-gradient(90deg,#002868 50%,#E8F1F5 50%)"></span>藍白左右雙色</button>
        </div>

        <div class="sub-label">多色背景（進階視覺區辨）：</div>
        <div class="btn-group" data-setting="bgMode">
          <button class="opt-btn" data-val="multi-rainbow"><span class="color-swatch" style="background:linear-gradient(135deg,#FF9AA2,#FFDAC1,#E2F0CB,#B5EAD7,#C7CEEA)"></span>柔和多色漸層</button>
          <button class="opt-btn" data-val="multi-dots"><span class="color-swatch" style="background:radial-gradient(circle,#FF595E 30%,#1982C4 35%,#1A1A2E 70%)"></span>深底彩色大圓點</button>
        </div>
      </div>

      <!-- 4. 目標圖案顏色選擇（12 種高飽和色 + 隨機變色） -->
      <div class="setting-group">
        <label>4. 目標圖案顏色（共 12 色及隨機輪換）</label>
        <div class="btn-group" data-setting="fgColor">
          <button class="opt-btn active" data-val="#FFFF00"><span class="color-swatch" style="background:#FFFF00"></span>鮮黃</button>
          <button class="opt-btn" data-val="#00FF00"><span class="color-swatch" style="background:#00FF00"></span>螢光綠</button>
          <button class="opt-btn" data-val="#FF2A2A"><span class="color-swatch" style="background:#FF2A2A"></span>純紅</button>
          <button class="opt-btn" data-val="#FF8800"><span class="color-swatch" style="background:#FF8800"></span>亮橙</button>
          <button class="opt-btn" data-val="#FF1493"><span class="color-swatch" style="background:#FF1493"></span>螢光粉紅</button>
          <button class="opt-btn" data-val="#B829FF"><span class="color-swatch" style="background:#B829FF"></span>亮紫</button>
          <button class="opt-btn" data-val="#00D4FF"><span class="color-swatch" style="background:#00D4FF"></span>天藍</button>
          <button class="opt-btn" data-val="#0055FF"><span class="color-swatch" style="background:#0055FF"></span>寶藍</button>
          <button class="opt-btn" data-val="#00E5B0"><span class="color-swatch" style="background:#00E5B0"></span>薄荷青綠</button>
          <button class="opt-btn" data-val="#FFFFFF"><span class="color-swatch" style="background:#FFFFFF"></span>純白</button>
          <button class="opt-btn" data-val="#000000"><span class="color-swatch" style="background:#000000"></span>純黑</button>
          <button class="opt-btn" data-val="#8B4513"><span class="color-swatch" style="background:#8B4513"></span>深啡</button>
          <button class="opt-btn" data-val="random"><span class="color-swatch" style="background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)"></span>每題隨機顏色</button>
        </div>
        <div id="contrast-warning">⚠️ 提示：目前選擇的「圖案顏色」與「背景顏色」相同或過於接近，建議更換顏色以確保高對比！</div>
      </div>

      <!-- 5. 目標圖案選擇（幾何圖形 + 高對比生活化圖案） -->
      <div class="setting-group">
        <label>5. 目標圖案樣式（幾何及生活化高對比圖案）</label>
        <div class="btn-group" data-setting="shape">
          <button class="opt-btn active" data-val="random">隨機輪換（全部 8 款）</button>
          <button class="opt-btn" data-val="sun">☀️ 發光太陽</button>
          <button class="opt-btn" data-val="smiley">😊 笑臉太陽</button>
          <button class="opt-btn" data-val="star">⭐ 閃亮星星</button>
          <button class="opt-btn" data-val="heart">❤️ 大愛心</button>
          <button class="opt-btn" data-val="apple">🍎 蘋果</button>
          <button class="opt-btn" data-val="car">🚗 汽車</button>
          <button class="opt-btn" data-val="flower">🌸 花朵</button>
          <button class="opt-btn" data-val="butterfly">🦋 蝴蝶</button>
        </div>
      </div>

      <!-- 6. 回合目標數量（自動暫停休息） -->
      <div class="setting-group">
        <label>6. 每回合目標數量（完成後暫停獎勵）</label>
        <div class="btn-group" data-setting="roundLimit">
          <button class="opt-btn" data-val="5">每 5 個暫停</button>
          <button class="opt-btn active" data-val="10">每 10 個暫停</button>
          <button class="opt-btn" data-val="15">每 15 個暫停</button>
          <button class="opt-btn" data-val="0">不限次數（連續模式）</button>
        </div>
      </div>

      <!-- 7. 視野區域偏重 -->
      <div class="setting-group">
        <label>7. 視野區域偏重（針對偏盲或視野缺損訓練）</label>
        <div class="btn-group" data-setting="fieldBias">
          <button class="opt-btn active" data-val="all">全螢幕平均</button>
          <button class="opt-btn" data-val="left">左側視野優先</button>
          <button class="opt-btn" data-val="right">右側視野優先</button>
          <button class="opt-btn" data-val="top">上半部視野優先</button>
          <button class="opt-btn" data-val="bottom">下半部視野優先</button>
        </div>
      </div>

      <!-- 8. 休息畫面保護 -->
      <div class="setting-group">
        <label>8. 休息畫面解鎖保護</label>
        <div class="btn-group" data-setting="teacherLock">
          <button class="opt-btn active" data-val="false">學生可直接點擊繼續</button>
          <button class="opt-btn" data-val="true">需老師長按 1.5 秒解鎖</button>
        </div>
      </div>

      <div class="panel-footer">
        <button class="action-btn btn-reset" id="reset-stats-btn">重設統計數據</button>
        <button class="action-btn btn-close" id="close-panel-btn">儲存並返回訓練</button>
      </div>
    </div>
  </div>

  <script>
    // === 遊戲狀態與預設參數 ===
    const state = {
      difficulty: 1,         // 1~5
      sizeRatio: 0.33,       // 佔螢幕短邊比例（0.33 = 1/3 畫面）
      bgMode: 'solid-black',
      fgColor: '#FFFF00',
      shape: 'random',
      roundLimit: 10,        // 0 = unlimited
      fieldBias: 'all',
      teacherLock: false,

      // 統計數據
      totalHits: 0,
      roundHits: 0,
      reactionTimes: [],
      roundReactionTimes: [],
      spawnTimestamp: 0,

      // 執行中物件
      activeTargets: [],
      sequenceIndex: 0,
      animFrameId: null,
      isPaused: true
    };

    const availableShapes = ['sun', 'smiley', 'star', 'heart', 'apple', 'car', 'flower', 'butterfly'];
    const randomColorPool = ['#FFFF00', '#00FF00', '#FF2A2A', '#FF8800', '#FF1493', '#B829FF', '#00D4FF', '#00E5B0', '#FFFFFF'];
    let lastShape = '';
    let lastColor = '';
    let lastPraiseIndex = -1;

    const gameArea = document.getElementById('game-area');
    const progressBarContainer = document.getElementById('progress-bar-container');

    // 依螢幕短邊動態計算像素尺寸（最大佔畫面 1/3）
    function getTargetPixelSize() {
      const minDim = Math.min(window.innerWidth, window.innerHeight);
      return Math.round(minDim * state.sizeRatio);
    }

    // 取得實際圖案顏色（支援每題隨機顏色）
    function getCurrentFgColor() {
      if (state.fgColor !== 'random') return state.fgColor;
      const pool = randomColorPool.filter(c => c !== lastColor);
      const chosen = pool[Math.floor(Math.random() * pool.length)];
      lastColor = chosen;
      return chosen;
    }

    // 判斷背景是否為淺色系
    function isLightBgMode(mode) {
      return ['solid-white', 'solid-cream', 'multi-rainbow'].includes(mode);
    }

    // 判斷是否為雙色或多色背景（需加強目標粗外框以保持高辨識度）
    function isComplexBgMode(mode) {
      return mode.startsWith('dual-') || mode.startsWith('multi-');
    }

    // === 套用純色、雙色或多色背景 ===
    function applyColors() {
      const mode = state.bgMode;
      gameArea.style.backgroundImage = 'none';
      gameArea.style.backgroundSize = 'auto';
      gameArea.style.backgroundPosition = '0 0';

      switch (mode) {
        case 'solid-white':
          gameArea.style.backgroundColor = '#FFFFFF';
          break;
        case 'solid-navy':
          gameArea.style.backgroundColor = '#001845';
          break;
        case 'solid-gray':
          gameArea.style.backgroundColor = '#26262A';
          break;
        case 'solid-cream':
          gameArea.style.backgroundColor = '#FFF8DC';
          break;
        case 'dual-checker':
          gameArea.style.backgroundColor = '#FFFFFF';
          gameArea.style.backgroundImage =
            'linear-gradient(45deg, #000000 25%, transparent 25%), ' +
            'linear-gradient(-45deg, #000000 25%, transparent 25%), ' +
            'linear-gradient(45deg, transparent 75%, #000000 75%), ' +
            'linear-gradient(-45deg, transparent 75%, #000000 75%)';
          gameArea.style.backgroundSize = '160px 160px';
          gameArea.style.backgroundPosition = '0 0, 0 80px, 80px -80px, -80px 0';
          break;
        case 'dual-stripes':
          gameArea.style.backgroundColor = '#000000';
          gameArea.style.backgroundImage =
            'repeating-linear-gradient(90deg, #000000 0px, #000000 90px, #3A3200 90px, #3A3200 180px)';
          break;
        case 'dual-split':
          gameArea.style.backgroundColor = '#002868';
          gameArea.style.backgroundImage =
            'linear-gradient(90deg, #002868 0%, #002868 50%, #E8F1F5 50%, #E8F1F5 100%)';
          break;
        case 'multi-rainbow':
          gameArea.style.backgroundColor = '#E2F0CB';
          gameArea.style.backgroundImage =
            'linear-gradient(135deg, #FF9AA2 0%, #FFDAC1 25%, #E2F0CB 50%, #B5EAD7 75%, #C7CEEA 100%)';
          break;
        case 'multi-dots':
          gameArea.style.backgroundColor = '#121324';
          gameArea.style.backgroundImage =
            'radial-gradient(#FF595E 26px, transparent 27px), ' +
            'radial-gradient(#1982C4 26px, transparent 27px), ' +
            'radial-gradient(#8AC926 22px, transparent 23px)';
          gameArea.style.backgroundSize = '220px 220px';
          gameArea.style.backgroundPosition = '0 0, 110px 110px, 55px 165px';
          break;
        case 'solid-black':
        default:
          gameArea.style.backgroundColor = '#000000';
          break;
      }

      const lightBg = isLightBgMode(mode);
      const accent = lightBg ? '#D90000' : '#00FF00';
      const distractor = lightBg ? 'rgba(0, 0, 0, 0.32)' : 'rgba(255, 255, 255, 0.35)';

      document.documentElement.style.setProperty('--accent-color', accent);
      document.documentElement.style.setProperty('--distractor-color', distractor);

      // 同色警告檢查
      const warnEl = document.getElementById('contrast-warning');
      const solidColorMap = {
        'solid-black': '#000000',
        'solid-white': '#FFFFFF',
        'solid-navy': '#001845',
        'solid-gray': '#26262A',
        'solid-cream': '#FFF8DC'
      };
      const currentSolidBg = solidColorMap[mode];
      const lowPairs = [
        ['#FFFFFF', '#FFF8DC'], ['#FFF8DC', '#FFFFFF'],
        ['#FFFF00', '#FFF8DC'], ['#FFF8DC', '#FFFF00'],
        ['#000000', '#26262A'], ['#26262A', '#000000'],
        ['#000000', '#001845'], ['#0055FF', '#001845']
      ];
      const isSameOrLow = currentSolidBg && state.fgColor !== 'random' && (
        currentSolidBg === state.fgColor ||
        lowPairs.some(([a, b]) => a === currentSolidBg && b === state.fgColor)
      );
      warnEl.style.display = isSameOrLow ? 'block' : 'none';
    }

    // === Web Audio API 音效合成器 ===
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSpawnSound() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, now);
      osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.15);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.35);
    }

    function playSuccessSound() {
      if (!audioCtx) return;
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        const now = audioCtx.currentTime + idx * 0.06;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.22, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.45);
      });
    }

    function playFanfareSound() {
      if (!audioCtx) return;
      const melody = [
        { f: 523.25, t: 0, d: 0.15 },
        { f: 659.25, t: 0.15, d: 0.15 },
        { f: 783.99, t: 0.30, d: 0.15 },
        { f: 1046.50, t: 0.48, d: 0.5 }
      ];
      melody.forEach(n => {
        const now = audioCtx.currentTime + n.t;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(n.f, now);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + n.d);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + n.d);
      });
    }

    // === 廣東話語音鼓勵（「好叻喎！」、「做得好！」） ===
    let cantoneseVoice = null;

    function loadCantoneseVoice() {
      if (!('speechSynthesis' in window)) return;
      const voices = window.speechSynthesis.getVoices();
      cantoneseVoice =
        voices.find(v => v.lang === 'zh-HK' || v.lang === 'zh_HK') ||
        voices.find(v => v.lang.toLowerCase().includes('hk') || v.name.toLowerCase().includes('cantonese') || v.name.includes('粵語') || v.name.includes('廣東話')) ||
        null;
    }

    if ('speechSynthesis' in window) {
      loadCantoneseVoice();
      window.speechSynthesis.onvoiceschanged = loadCantoneseVoice;
    }

    function speakPraise(customText) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const phrases = ['好叻喎！', '做得好！'];
      let text = customText;
      if (!text) {
        lastPraiseIndex = (lastPraiseIndex + 1) % phrases.length;
        text = phrases[lastPraiseIndex];
      }
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'zh-HK';
      if (cantoneseVoice) {
        utter.voice = cantoneseVoice;
      }
      utter.rate = 0.92;
      utter.pitch = 1.15;
      window.speechSynthesis.speak(utter);
    }

    // === 繪製高對比幾何化 SVG 圖案（含太陽、笑臉、星星、愛心、蘋果、汽車、花朵、蝴蝶） ===
    function getShapeSVG(shapeType, fgColor) {
      let chosen = shapeType;
      if (chosen === 'random') {
        const pool = availableShapes.filter(s => s !== lastShape);
        chosen = pool[Math.floor(Math.random() * pool.length)];
      }
      lastShape = chosen;

      const isDarkFg = ['#000000', '#001845', '#0055FF', '#8B4513'].includes(fgColor.toUpperCase());
      const detailColor = isDarkFg ? '#FFFFFF' : '#000000';
      const isComplex = isComplexBgMode(state.bgMode);
      const outlineStroke = isComplex ? detailColor : 'none';
      const outlineWidth = isComplex ? '5' : '0';

      switch (chosen) {
        case 'smiley':
          return `
            <svg viewBox="0 0 124 124" width="100%" height="100%">
              <circle cx="62" cy="62" r="52" fill="${fgColor}" stroke="${outlineStroke}" stroke-width="${outlineWidth}" />
              <circle cx="44" cy="48" r="7" fill="${detailColor}" />
              <circle cx="80" cy="48" r="7" fill="${detailColor}" />
              <path d="M 38 70 Q 62 96 86 70" fill="none" stroke="${detailColor}" stroke-width="9" stroke-linecap="round" />
            </svg>`;
        case 'star':
          return `
            <svg viewBox="0 0 124 124" width="100%" height="100%">
              <polygon points="62,10 77,44 114,48 86,73 94,110 62,91 30,110 38,73 10,48 47,44"
                fill="${fgColor}" stroke="${outlineStroke !== 'none' ? outlineStroke : fgColor}" stroke-width="${outlineStroke !== 'none' ? 5 : 4}" stroke-linejoin="round" />
            </svg>`;
        case 'heart':
          return `
            <svg viewBox="0 0 124 124" width="100%" height="100%">
              <path d="M62 106 C22 78, 8 50, 26 28 C40 12, 58 22, 62 34 C66 22, 84 12, 98 28 C116 50, 102 78, 62 106 Z"
                fill="${fgColor}" stroke="${outlineStroke}" stroke-width="${outlineWidth}" stroke-linejoin="round" />
            </svg>`;
        case 'apple':
          return `
            <svg viewBox="0 0 124 124" width="100%" height="100%">
              <path d="M62 38 C46 28, 22 36, 22 64 C22 92, 42 112, 56 112 C60 112, 62 109, 62 109 C62 109, 64 112, 68 112 C82 112, 102 92, 102 64 C102 36, 78 28, 62 38 Z"
                fill="${fgColor}" stroke="${outlineStroke}" stroke-width="${outlineWidth}" stroke-linejoin="round" />
              <path d="M62 36 L62 16" stroke="${fgColor}" stroke-width="9" stroke-linecap="round" />
              <path d="M64 24 C74 10, 94 12, 96 24 C84 32, 70 30, 64 24 Z"
                fill="${fgColor}" stroke="${outlineStroke}" stroke-width="${outlineWidth}" stroke-linejoin="round" />
              <path d="M36 56 C34 68, 38 80, 44 88" fill="none" stroke="${detailColor}" stroke-width="7" stroke-linecap="round" />
            </svg>`;
        case 'car':
          return `
            <svg viewBox="0 0 124 124" width="100%" height="100%">
              <path d="M24 58 L34 32 C37 26, 42 24, 48 24 L76 24 C82 24, 87 26, 90 32 L100 58 L110 62 C114 64, 116 68, 116 74 L116 88 C116 92, 112 96, 108 96 L16 96 C12 96, 8 92, 8 88 L8 74 C8 68, 10 64, 14 62 Z"
                fill="${fgColor}" stroke="${outlineStroke}" stroke-width="${outlineWidth}" stroke-linejoin="round" />
              <polygon points="42,33 58,33 58,54 34,54" fill="${detailColor}" />
              <polygon points="66,33 82,33 90,54 66,54" fill="${detailColor}" />
              <circle cx="34" cy="96" r="16" fill="${detailColor}" />
              <circle cx="34" cy="96" r="8" fill="${fgColor}" />
              <circle cx="90" cy="96" r="16" fill="${detailColor}" />
              <circle cx="90" cy="96" r="8" fill="${fgColor}" />
            </svg>`;
        case 'flower':
          return `
            <svg viewBox="0 0 124 124" width="100%" height="100%">
              <g fill="${fgColor}" stroke="${outlineStroke}" stroke-width="${outlineWidth}">
                <circle cx="62" cy="28" r="22" />
                <circle cx="94" cy="52" r="22" />
                <circle cx="82" cy="90" r="22" />
                <circle cx="42" cy="90" r="22" />
                <circle cx="30" cy="52" r="22" />
              </g>
              <circle cx="62" cy="62" r="26" fill="${fgColor}" />
              <circle cx="62" cy="62" r="16" fill="${detailColor}" />
            </svg>`;
        case 'butterfly':
          return `
            <svg viewBox="0 0 124 124" width="100%" height="100%">
              <circle cx="36" cy="44" r="26" fill="${fgColor}" stroke="${outlineStroke}" stroke-width="${outlineWidth}" />
              <circle cx="88" cy="44" r="26" fill="${fgColor}" stroke="${outlineStroke}" stroke-width="${outlineWidth}" />
              <circle cx="40" cy="84" r="20" fill="${fgColor}" stroke="${outlineStroke}" stroke-width="${outlineWidth}" />
              <circle cx="84" cy="84" r="20" fill="${fgColor}" stroke="${outlineStroke}" stroke-width="${outlineWidth}" />
              <circle cx="34" cy="42" r="8" fill="${detailColor}" />
              <circle cx="90" cy="42" r="8" fill="${detailColor}" />
              <rect x="55" y="24" width="14" height="78" rx="7" fill="${detailColor}" />
              <path d="M58 26 L44 10 M66 26 L80 10" stroke="${fgColor}" stroke-width="7" stroke-linecap="round" />
            </svg>`;
        case 'sun':
        default:
          return `
            <svg viewBox="0 0 124 124" width="100%" height="100%">
              <circle cx="62" cy="62" r="35" fill="${fgColor}" stroke="${outlineStroke}" stroke-width="${outlineWidth}" />
              <g stroke="${fgColor}" stroke-width="9" stroke-linecap="round">
                <line x1="62" y1="8" x2="62" y2="20" />
                <line x1="62" y1="104" x2="62" y2="116" />
                <line x1="8" y1="62" x2="20" y2="62" />
                <line x1="104" y1="62" x2="116" y2="62" />
                <line x1="24" y1="24" x2="32" y2="32" />
                <line x1="92" y1="92" x2="100" y2="100" />
                <line x1="100" y1="24" x2="92" y2="32" />
                <line x1="32" y1="92" x2="24" y2="100" />
              </g>
            </svg>`;
      }
    }

    function getDistractorSVG(type, color) {
      if (type === 0) {
        return `<svg viewBox="0 0 100 100" width="100%" height="100%">
          <rect x="14" y="14" width="72" height="72" fill="none" stroke="${color}" stroke-width="10" />
        </svg>`;
      } else {
        return `<svg viewBox="0 0 100 100" width="100%" height="100%">
          <polygon points="50,12 90,86 10,86" fill="none" stroke="${color}" stroke-width="10" stroke-linejoin="round" />
        </svg>`;
      }
    }

    // === 更新頂部回合進度點 ===
    function renderProgressDots() {
      progressBarContainer.innerHTML = '';
      if (state.roundLimit <= 0) {
        progressBarContainer.style.display = 'none';
        return;
      }
      progressBarContainer.style.display = 'flex';
      for (let i = 0; i < state.roundLimit; i++) {
        const dot = document.createElement('div');
        dot.className = 'progress-dot' + (i < state.roundHits ? ' filled' : '');
        progressBarContainer.appendChild(dot);
      }
    }

    // === 計算符合視野偏重與超大圖案安全邊界的座標 ===
    function getRandomPosition(existingPositions = [], forceEdge = false) {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const targetSize = getTargetPixelSize();
      const margin = targetSize * 0.55 + 24;

      let minX = margin, maxX = Math.max(margin + 10, w - margin);
      let minY = margin + 25, maxY = Math.max(margin + 35, h - margin);

      if (state.fieldBias === 'left') maxX = Math.max(minX + 20, w * 0.48);
      if (state.fieldBias === 'right') minX = Math.min(maxX - 20, w * 0.52);
      if (state.fieldBias === 'top') maxY = Math.max(minY + 20, h * 0.48);
      if (state.fieldBias === 'bottom') minY = Math.min(maxY - 20, h * 0.52);

      let bestX = (minX + maxX) / 2;
      let bestY = (minY + maxY) / 2;

      for (let attempt = 0; attempt < 25; attempt++) {
        let x = minX + Math.random() * Math.max(10, maxX - minX);
        let y = minY + Math.random() * Math.max(10, maxY - minY);

        if (forceEdge) {
          const edge = Math.floor(Math.random() * 4);
          if (edge === 0) x = minX + Math.random() * (w * 0.12);
          else if (edge === 1) x = maxX - Math.random() * (w * 0.12);
          else if (edge === 2) y = minY + Math.random() * (h * 0.12);
          else y = maxY - Math.random() * (h * 0.12);
        }

        const tooClose = existingPositions.some(p => Math.hypot(p.x - x, p.y - y) < targetSize * 1.15);
        if (!tooClose) {
          bestX = x;
          bestY = y;
          break;
        }
      }
      return { x: bestX, y: bestY };
    }

    // === 清除畫面上現有物件 ===
    function clearBoard() {
      if (state.animFrameId) {
        cancelAnimationFrame(state.animFrameId);
        state.animFrameId = null;
      }
      document.querySelectorAll('.target-wrapper, .distractor-item').forEach(el => el.remove());
      state.activeTargets = [];
      state.sequenceIndex = 0;
    }

    // === 生成新一題目標 ===
    function spawnRound() {
      if (state.isPaused) return;
      clearBoard();

      const occupied = [];
      const targetSize = getTargetPixelSize();
      const distractorColor = getComputedStyle(document.documentElement).getPropertyValue('--distractor-color').trim();
      state.spawnTimestamp = performance.now();
      playSpawnSound();

      // 難度 4：序列雙重掃視
      if (state.difficulty === 4) {
        const w = window.innerWidth;
        const h = window.innerHeight;
        const margin = targetSize * 0.55 + 20;
        const yBase = Math.min(h - margin, Math.max(margin + 30, h * (0.35 + Math.random() * 0.3)));
        const positions = [
          { x: Math.max(margin, w * 0.25), y: yBase },
          { x: Math.min(w - margin, w * 0.75), y: yBase }
        ];

        positions.forEach((pos, idx) => {
          createTargetElement(pos.x, pos.y, idx, true);
        });
        return;
      }

      // 難度 3：加入 2 個低顯著性幾何干擾物
      if (state.difficulty === 3) {
        const targetPos = getRandomPosition(occupied, false);
        occupied.push(targetPos);
        createTargetElement(targetPos.x, targetPos.y, 0, false);

        for (let i = 0; i < 2; i++) {
          const dPos = getRandomPosition(occupied, false);
          occupied.push(dPos);
          const dEl = document.createElement('div');
          dEl.className = 'distractor-item';
          dEl.style.width = `${targetSize * 0.75}px`;
          dEl.style.height = `${targetSize * 0.75}px`;
          dEl.style.left = `${dPos.x}px`;
          dEl.style.top = `${dPos.y}px`;
          dEl.innerHTML = getDistractorSVG(i % 2, distractorColor);
          gameArea.appendChild(dEl);
        }
        return;
      }

      // 難度 1, 2, 5
      const isEdge = (state.difficulty === 5);
      const pos = getRandomPosition(occupied, isEdge);
      const targetObj = createTargetElement(pos.x, pos.y, 0, false, isEdge);

      if (state.difficulty === 2) {
        startTrackingMotion(targetObj);
      }
    }

    // 建立單個可互動目標 DOM
    function createTargetElement(x, y, seqIdx = 0, showSequenceUI = false, flashMode = false) {
      const targetSize = getTargetPixelSize();
      const currentColor = getCurrentFgColor();
      const wrapper = document.createElement('div');
      wrapper.className = 'target-wrapper';
      const totalSize = targetSize + 40;
      wrapper.style.width = `${totalSize}px`;
      wrapper.style.height = `${totalSize}px`;
      wrapper.style.left = `${x}px`;
      wrapper.style.top = `${y}px`;

      const graphic = document.createElement('div');
      graphic.className = 'target-graphic' + (flashMode ? ' flash-mode' : '');
      graphic.style.filter = isComplexBgMode(state.bgMode)
        ? `drop-shadow(0 0 12px rgba(0,0,0,0.85))`
        : `drop-shadow(0 0 16px ${currentColor})`;
      graphic.innerHTML = getShapeSVG(state.shape, currentColor);
      wrapper.appendChild(graphic);

      if (showSequenceUI) {
        const isDarkFg = ['#000000', '#001845', '#0055FF', '#8B4513'].includes(currentColor.toUpperCase());
        const num = document.createElement('div');
        num.className = 'target-number';
        num.style.color = isDarkFg ? '#FFFFFF' : '#000000';
        num.style.fontSize = `${targetSize * 0.34}px`;
        num.textContent = seqIdx + 1;
        wrapper.appendChild(num);

        if (seqIdx === 0) {
          const ring = document.createElement('div');
          ring.className = 'guide-ring';
          wrapper.appendChild(ring);
        } else {
          wrapper.style.opacity = '0.45';
        }
      }

      const targetData = { el: wrapper, x, y, seqIdx, hit: false, color: currentColor };
      state.activeTargets.push(targetData);

      const handleHit = (e) => {
        e.stopPropagation();
        e.preventDefault();
        onTargetHit(targetData);
      };

      wrapper.addEventListener('pointerdown', handleHit);
      if (state.difficulty === 2) {
        wrapper.addEventListener('pointerenter', (e) => {
          if (e.buttons > 0) handleHit(e);
        });
      }

      gameArea.appendChild(wrapper);
      return targetData;
    }

    // 難度 2 追視移動動畫
    function startTrackingMotion(targetObj) {
      const targetSize = getTargetPixelSize();
      const margin = targetSize * 0.55 + 20;
      const w = window.innerWidth;
      const h = window.innerHeight;
      let vx = (Math.random() > 0.5 ? 1 : -1) * 1.65;
      let vy = (Math.random() > 0.5 ? 1 : -1) * 1.15;

      function step() {
        if (state.isPaused || targetObj.hit) return;
        targetObj.x += vx;
        targetObj.y += vy;

        if (targetObj.x < margin || targetObj.x > w - margin) vx *= -1;
        if (targetObj.y < margin + 25 || targetObj.y > h - margin) vy *= -1;

        targetObj.el.style.left = `${targetObj.x}px`;
        targetObj.el.style.top = `${targetObj.y}px`;
        state.animFrameId = requestAnimationFrame(step);
      }
      state.animFrameId = requestAnimationFrame(step);
    }

    // === 擊中目標處理 ===
    function onTargetHit(targetData) {
      if (targetData.hit || state.isPaused) return;

      if (state.difficulty === 4 && targetData.seqIdx !== state.sequenceIndex) {
        return;
      }

      targetData.hit = true;
      spawnCelebrationParticles(targetData.x, targetData.y, targetData.color);
      playSuccessSound();
      if (navigator.vibrate) navigator.vibrate(70);

      if (state.difficulty === 4 && state.sequenceIndex === 0) {
        targetData.el.remove();
        state.sequenceIndex = 1;
        const nextTarget = state.activeTargets[1];
        if (nextTarget) {
          nextTarget.el.style.opacity = '1';
          const ring = document.createElement('div');
          ring.className = 'guide-ring';
          nextTarget.el.appendChild(ring);
        }
        return;
      }

      const rt = Math.min(30, (performance.now() - state.spawnTimestamp) / 1000);
      state.reactionTimes.push(rt);
      state.roundReactionTimes.push(rt);
      state.totalHits += 1;
      state.roundHits += 1;

      renderProgressDots();
      updateStatsUI();
      clearBoard();

      if (state.roundLimit > 0 && state.roundHits >= state.roundLimit) {
        setTimeout(showRoundBreak, 450);
      } else {
        speakPraise();
        setTimeout(spawnRound, 650);
      }
    }

    function spawnCelebrationParticles(cx, cy, mainColor) {
      const colors = [mainColor || '#FFFF00', '#00FF00', '#FF5555', '#55FFFF'];
      for (let i = 0; i < 18; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const size = 14 + Math.random() * 14;
        p.style.width = `${size}px`;
        p.style.height = `${size}px`;
        p.style.backgroundColor = colors[i % colors.length];
        p.style.left = `${cx}px`;
        p.style.top = `${cy}px`;
        gameArea.appendChild(p);

        const angle = (Math.PI * 2 * i) / 18;
        const dist = 80 + Math.random() * 140;
        const tx = Math.cos(angle) * dist;
        const ty = Math.sin(angle) * dist;

        p.animate([
          { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
          { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(0.2)`, opacity: 0 }
        ], {
          duration: 580,
          easing: 'cubic-bezier(0.16, 1, 0.3, 1)'
        }).onfinish = () => p.remove();
      }
    }

    gameArea.addEventListener('pointerdown', (e) => {
      if (state.isPaused) return;
      const ripple = document.createElement('div');
      ripple.className = 'miss-ripple';
      ripple.style.left = `${e.clientX}px`;
      ripple.style.top = `${e.clientY}px`;
      gameArea.appendChild(ripple);
      setTimeout(() => ripple.remove(), 520);
    });

    // === 回合結束休息獎勵畫面 ===
    function showRoundBreak() {
      state.isPaused = true;
      playFanfareSound();
      speakPraise('好叻喎，做得好！完成一回合啦，休息一陣先！');

      const avgRoundRt = state.roundReactionTimes.length
        ? (state.roundReactionTimes.reduce((a, b) => a + b, 0) / state.roundReactionTimes.length).toFixed(2)
        : '--';

      document.getElementById('break-stats-text').innerHTML = `
        本回合完成：<strong>${state.roundHits}</strong> 個目標<br/>
        本回合平均反應時間：<strong>${avgRoundRt}</strong> 秒<br/>
        本節累計完成：<strong>${state.totalHits}</strong> 個目標
      `;

      document.getElementById('teacher-unlock-hint').style.display =
        state.teacherLock ? 'block' : 'none';

      document.getElementById('break-overlay').style.display = 'flex';
    }

    function startNextRound() {
      state.roundHits = 0;
      state.roundReactionTimes = [];
      renderProgressDots();
      document.getElementById('break-overlay').style.display = 'none';
      state.isPaused = false;
      spawnRound();
    }

    const continueBtn = document.getElementById('continue-btn');
    let continueHoldTimer = null;

    continueBtn.addEventListener('pointerdown', () => {
      initAudio();
      if (!state.teacherLock) {
        startNextRound();
      } else {
        continueBtn.style.opacity = '0.7';
        continueHoldTimer = setTimeout(() => {
          continueBtn.style.opacity = '1';
          startNextRound();
        }, 1500);
      }
    });

    ['pointerup', 'pointerleave', 'pointercancel'].forEach(evt => {
      continueBtn.addEventListener(evt, () => {
        clearTimeout(continueHoldTimer);
        continueBtn.style.opacity = '1';
      });
    });

    // === 隱藏式教師按鈕長按 2 秒邏輯 ===
    const trigger = document.getElementById('teacher-trigger');
    const holdCircle = document.getElementById('hold-circle');
    let holdStart = null;
    let holdRaf = null;

    function updateHoldProgress(timestamp) {
      if (!holdStart) return;
      const elapsed = timestamp - holdStart;
      const progress = Math.min(1, elapsed / 2000);
      holdCircle.style.strokeDashoffset = 157 * (1 - progress);

      if (progress >= 1) {
        holdStart = null;
        holdCircle.style.strokeDashoffset = 157;
        openTeacherPanel();
      } else {
        holdRaf = requestAnimationFrame(updateHoldProgress);
      }
    }

    trigger.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      holdStart = performance.now();
      holdRaf = requestAnimationFrame(updateHoldProgress);
    });

    ['pointerup', 'pointerleave', 'pointercancel'].forEach(evt => {
      trigger.addEventListener(evt, () => {
        holdStart = null;
        cancelAnimationFrame(holdRaf);
        holdCircle.style.strokeDashoffset = 157;
      });
    });

    // === 教師設定面板互動 ===
    const teacherPanel = document.getElementById('teacher-panel');

    function openTeacherPanel() {
      state.isPaused = true;
      updateStatsUI();
      teacherPanel.style.display = 'flex';
    }

    function updateStatsUI() {
      document.getElementById('stat-total').textContent = state.totalHits;
      const avg = state.reactionTimes.length
        ? (state.reactionTimes.reduce((a, b) => a + b, 0) / state.reactionTimes.length).toFixed(2)
        : '--';
      document.getElementById('stat-avg-rt').textContent = avg;
      document.getElementById('stat-round').textContent =
        state.roundLimit > 0 ? `${state.roundHits} / ${state.roundLimit}` : `${state.roundHits} (不限)`;
    }

    document.querySelectorAll('.btn-group').forEach(group => {
      const settingKey = group.dataset.setting;
      group.querySelectorAll('.opt-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll(`.btn-group[data-setting="${settingKey}"] .opt-btn`).forEach(b => b.classList.remove('active'));
          btn.classList.add('active');

          let val = btn.dataset.val;
          if (['difficulty', 'sizeRatio', 'roundLimit'].includes(settingKey)) {
            val = Number(val);
          } else if (settingKey === 'teacherLock') {
            val = (val === 'true');
          }
          state[settingKey] = val;

          if (settingKey === 'bgMode' || settingKey === 'fgColor') {
            applyColors();
          }
          if (settingKey === 'roundLimit') {
            state.roundHits = 0;
            renderProgressDots();
          }
          updateStatsUI();
        });
      });
    });

    document.getElementById('reset-stats-btn').addEventListener('click', () => {
      state.totalHits = 0;
      state.roundHits = 0;
      state.reactionTimes = [];
      state.roundReactionTimes = [];
      renderProgressDots();
      updateStatsUI();
    });

    document.getElementById('close-panel-btn').addEventListener('click', () => {
      teacherPanel.style.display = 'none';
      if (document.getElementById('break-overlay').style.display !== 'flex') {
        state.isPaused = false;
        spawnRound();
      }
    });

    window.addEventListener('resize', () => {
      if (!state.isPaused) {
        spawnRound();
      }
    });

    // === 啟動遊戲 ===
    document.getElementById('start-btn').addEventListener('click', () => {
      initAudio();
      loadCantoneseVoice();
      document.getElementById('start-overlay').style.display = 'none';
      applyColors();
      renderProgressDots();
      state.isPaused = false;
      spawnRound();
    });
  </script>
</body>
</html>
